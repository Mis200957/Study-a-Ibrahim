<meta name="theme-color" content="#070b1f"><title>المذاكر الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a1c;--bg2:#0f1740;--card:#18226a;--tx:#ffffff;--mu:#c3cbf5;--p:#8b5cf6;--b:#3b82f6;--c:#22d3ee;--ok:#34d399;--bad:#fb7185;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eef1ff;--bg2:#fff;--card:#fff;--tx:#0b1030;--mu:#3b4580}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1ff;--bg2:#fff;--card:#fff;--tx:#0b1030;--mu:#3b4580}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 500px at 80% -10%,#2a1b6b55,transparent),var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,sans-serif;font-size:16px;padding-bottom:76px}
h1,h2,h3{margin:0 0 10px}
h2{color:var(--c);text-shadow:0 0 14px var(--p)}
h3{color:var(--tx)}
.qt{cursor:pointer;margin:0 0 12px;padding:10px 14px;border-radius:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--p),var(--b));box-shadow:0 0 18px color-mix(in srgb,var(--p) 55%,transparent)}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;transition:opacity .6s}
#splash h1{font-size:clamp(40px,12vw,84px);font-weight:800;color:#fff;text-shadow:0 0 12px var(--c),0 0 40px var(--p);animation:pulse 3s ease-in-out infinite}
#splash p{color:var(--mu);margin:0}
@keyframes pulse{50%{text-shadow:0 0 22px var(--c),0 0 70px var(--b)}}
@media (prefers-reduced-motion:reduce){#splash h1{animation:none}}
main{max-width:900px;margin:0 auto;padding:14px}
.card{background:var(--card);border:2px solid #7c8cf066;border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{text-align:center}.stat b{display:block;font-size:30px;color:var(--c)}
.stat span{color:var(--mu);font-size:14px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid #6d7bd655;border-radius:10px;padding:9px 11px}
textarea{width:100%;min-height:140px}
input,select{max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.row>input,.row>select{flex:1 1 130px}
button{cursor:pointer;background:linear-gradient(135deg,var(--p),var(--b));border:0;color:#fff;font-weight:500;box-shadow:0 0 14px #8b5cf655}
button:hover{box-shadow:0 0 22px var(--c)}
button.g{background:transparent;border:1px solid #6d7bd666;color:var(--tx);box-shadow:none}
button.d{background:var(--bad);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.item{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #7c8cf044;flex-wrap:wrap}
.item small{color:var(--mu);display:block}
.done{opacity:.55;text-decoration:line-through}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#22d3ee22;color:var(--c)}
.bar{height:10px;background:#6d7bd633;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--c));transition:width .4s}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--bg2);border-top:1px solid #6d7bd644;display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;gap:4px}
nav button{flex:0 0 auto;background:transparent;box-shadow:none;color:var(--mu);padding:6px 12px;font-size:13px}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--p),var(--b));box-shadow:0 0 14px var(--p)}
.out{white-space:pre-wrap;line-height:1.9}
canvas{width:100%;background:var(--bg2);border-radius:12px;border:1px solid #6d7bd644}
.mic{width:84px;height:84px;border-radius:50%;font-size:30px}
.mic.on{background:var(--bad);animation:pulse2 1s infinite}
@keyframes pulse2{50%{box-shadow:0 0 34px var(--bad)}}
.big{font-size:56px;text-align:center;color:var(--c);font-weight:800;letter-spacing:2px}
.dt{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--c);margin-bottom:10px;padding:8px 12px;border:1px solid #22d3ee44;border-radius:12px;background:#22d3ee0f}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kp button{padding:16px 0;font-size:20px}
.msg{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:90%}.me{background:#3b82f633}.ai{background:#8b5cf633}

/* v19 palette */
:root{--bg:#0a1020;--bg2:#0e162b;--card:#121c36;--tx:#eef2ff;--mu:#9fb0d6;--p:#6366f1;--b:#0ea5e9;--c:#5eead4;--bad:#f87171}
:root[data-theme="light"]{--bg:#f3f6fc;--bg2:#fff;--card:#fff;--tx:#0f172a;--mu:#51607f;--c:#0d9488}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f6fc;--bg2:#fff;--card:#fff;--tx:#0f172a;--mu:#51607f;--c:#0d9488}}
body{background:radial-gradient(900px 500px at 80% -10%,#6366f126,transparent),var(--bg)}
h2{text-shadow:none}#splash h1{text-shadow:0 0 18px var(--p)}
.card{border:1px solid color-mix(in srgb,var(--p) 28%,transparent);box-shadow:0 2px 14px #0003}
button{box-shadow:none}button:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent)}
nav button{border-bottom:3px solid transparent!important}nav button.on{border-bottom-color:var(--c)!important;box-shadow:none}
.qt{box-shadow:none}.tag{background:color-mix(in srgb,var(--c) 16%,transparent)}.mk{outline:1px dashed var(--c);border-radius:8px}
</style>
</head>
<body>
<div id="splash">
  <img id="logo" width="110" height="110" alt="شعار المذاكر الذكي" style="border-radius:26px;box-shadow:0 0 34px var(--p)">
  <p>تطبيق المذاكرة الذكي</p>
  <h1>إبراهيم سامح</h1>
  <p>المذاكر الذكي · IBRAHIM SMART STUDY</p>
  <button id="start" style="font-size:20px;padding:12px 34px">ابدأ المذاكرة</button>
</div>
<main id="app"></main>
<nav id="nav"></nav>

<script>
"use strict";
const $=s=>document.querySelector(s);
try{$("#logo").src=document.querySelector('link[rel="apple-touch-icon"]').href}catch(e){}
const DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const COLORS=["#8b5cf6","#3b82f6","#22d3ee","#34d399","#fbbf24","#fb7185"];
let S={lessons:[],tasks:[],sched:[],notes:[],maps:[],sums:[],pomo:0,theme:"dark"};
try{if(!localStorage.getItem("ibrahim-study-bak16")){const r0=localStorage.getItem("ibrahim-study");if(r0)localStorage.setItem("ibrahim-study-bak16",r0)}}catch(e){}
try{const r=localStorage.getItem("ibrahim-study");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(window.APP_KEY){S.key=window.APP_KEY;S.prov=window.APP_PROV||"gemini"}
const save=()=>{try{localStorage.setItem("ibrahim-study",JSON.stringify(S))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const val=id=>($("#"+id)||{}).value||"";
let lv="",view="home",sample=null,dl=null,curMap=null,editId=null;
const TABS=[["home","الرئيسية"],["lessons","الدروس"],["tasks","المهمات"],["sched","الجدول"],["map","الخرائط الذهنية"],["sum","تلخيص المواد"],["daily","دروس اليوم"],["tutor","المعلم الذكي"],["quran","المصحف"],["rem","التذكير"],["calc","الحاسبة"],["exams","الامتحانات"],["mem","الذاكرة والتحليل"],["voice","المساعد الصوتي"],["pomo","بومودورو"],["notes","الملاحظات"],["set","الإعدادات"]];
const QUOTES=["ذاكر اليوم لتفرح غدًا.","كل صفحة تقرؤها تقرّبك من حلمك.","النجاح يبدأ بخطوة صغيرة كل يوم.","لا تؤجل مذاكرة اليوم إلى الغد.","أنت أقوى مما تظن، واصل!","الاجتهاد اليوم هو تفوّق الغد.","ركّز خمسًا وعشرين دقيقة، وسترى الفرق.","كل إنجاز عظيم بدأ بقرار.","اجعل هدفك أمامك ولا تتوقف.","أخطاؤك دروس، وتعلّمك قوّتك.","ثقتك بنفسك نصف النجاح.","من جدّ وجد، ومن زرع حصد.","خذ استراحة قصيرة ثم عد أقوى.","إبراهيم، أنت قادر على التفوّق!","اليوم الجيد يبدأ بخطة وتنفيذ.","قارن نفسك بالأمس وليس بالآخرين.","التعب مؤقت، والنجاح يدوم.","كل مسألة تحلّها تزيد ثقتك.","ابدأ الآن، فالوقت لا ينتظر.","خطوة اليوم تصنع نتيجة الامتحان.","النجاح عادة تُبنى كل يوم.","اقرأ اليوم لتقود غدًا.","كن أفضل نسخة من نفسك.","لا مستحيل مع الإصرار.","اصنع فرصتك بيدك.","اجتهد بصمت ودع نجاحك يتكلم.","العلم نور، فأنِر طريقك.","كل يوم مذاكرة يقرّبك من القمة.","اجعل مذاكرتك متعة لا عبئًا.","تحدَّ نفسك اليوم.","لا تستسلم، فأنت قريب جدًا.","الوقت كالسيف، فاغتنمه.","ركّز على التقدم لا الكمال.","فهم الدرس أفضل من حفظه فقط.","راجع كثيرًا، تتقن أكثر.","أحلامك تستحق مجهودك.","حين تتعب، تذكّر لماذا بدأت.","درجة اليوم ثمرة جهد الأمس.","اجعل منافستك مع نفسك.","النوم الجيد مع مذاكرة منظمة سر التفوق.","قسّم الدرس الكبير إلى أجزاء صغيرة.","اكتب ما تتعلمه لتثبّته.","اشرح الدرس لنفسك لتفهمه.","خمس دقائق من التركيز خير من ساعة تشتت.","ابتسم، أنت تتقدم.","كل خطأ في التدريب يمنع خطأً في الامتحان.","إبراهيم، مستقبلك يصنعه اجتهادك اليوم.","الطريق للقمة يبدأ من هذه الصفحة.","اجعل اليوم أفضل من أمس.","الإصرار يهزم الصعوبة.","أنجز مهمة واحدة الآن.","التفوق قرار فاتخذه.","شجّع نفسك، فأنت تستحق.","اطمئن، الجهد لا يضيع.","مذاكرة هادئة اليوم، فرحة كبيرة غدًا.","قوتك الحقيقية في استمرارك."];
function quote(){const i=(new Date().getDate()+TABS.findIndex(t=>t[0]===view)+(S.qn||0))%QUOTES.length;return `<div class="qt" onclick="S.qn=(S.qn||0)+1;render()">💪 ${QUOTES[i]}</div>`}
function dateBar(){const n=new Date();let h="";try{h=n.toLocaleDateString("ar-SA-u-ca-islamic-umalqura",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch(e){}return `<div class="dt"><span>📅 ${n.toLocaleDateString("ar-EG",{day:"numeric",month:"long",year:"numeric"})} م</span><span>🌙 ${h}</span></div>`}
const TONES=["جرس كلاسيكي","منبه سريع","نغمة هادئة","ديجيتال","إشعار لطيف","🚨 إنذار إطفاء (عالي جدًا)"];
function fireAlarm(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain();g.gain.value=1;o.type="square";o2.type="sawtooth";const t=a.currentTime;for(let k=0;k<16;k++){const f=k%2?770:960;o.frequency.setValueAtTime(f,t+k*.5);o2.frequency.setValueAtTime(f*2,t+k*.5)}o.connect(g);o2.connect(g);g.connect(a.destination);o.start(t);o2.start(t);o.stop(t+8);o2.stop(t+8)}catch(e){}}
function playTone(i){if(!allow("sound"))return;if(i===5)return fireAlarm();try{const a=new (window.AudioContext||window.webkitAudioContext)();const P=[[[880,0],[1100,.25],[880,.5],[1100,.75]],[[1000,0],[1000,.15],[1000,.3],[1400,.45],[1000,.6],[1400,.75]],[[523,0],[659,.4],[784,.8],[1046,1.2]],[[1200,0],[900,.12],[1200,.24],[900,.36],[1500,.48]],[[660,0],[880,.2],[1320,.4]]][i]||[[880,0]];const w=["sine","square","sine","sawtooth","triangle"][i]||"sine";for(let r=0;r<3;r++)P.forEach(([f,t])=>{const o=a.createOscillator(),g=a.createGain();o.type=w;o.frequency.value=f;o.connect(g);g.connect(a.destination);const s=a.currentTime+t+r*(P[P.length-1][1]+.8);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.35,s+.03);g.gain.exponentialRampToValueAtTime(.0001,s+.3);o.start(s);o.stop(s+.35)})}catch(e){}}
function getImg(id){return new Promise(res=>{if(!allow("img")){toast("الصور معطّلة من الأذونات");return res(null)}const f=($("#"+id)||{}).files;if(!f||!f[0])return res(null);const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b),"image/jpeg",.85)};im.onerror=()=>res(null);im.src=URL.createObjectURL(f[0])})}
const subjects=()=>[...new Set([...S.lessons.map(l=>l.subj),...S.sched.map(l=>l.subj)])].filter(Boolean);

/* ---------- Voice helpers ---------- */
function speak(t){if(!allow("speak"))return;try{speechSynthesis.cancel();const V=speechSynthesis.getVoices();const parts=String(t).match(/[A-Za-z][A-Za-z0-9\s.,'\-+=*\/()%:]*|[^A-Za-z]+/g)||[String(t)];parts.forEach(p=>{if(!p.trim())return;const en=/^[A-Za-z]/.test(p.trim());const u=new SpeechSynthesisUtterance(p);u.rate=S.rate||1;u.volume=S.vol??1;u.lang=en?"en-US":"ar-SA";const v=V.find(v=>v.lang.startsWith(en?"en":"ar"));if(v)u.voice=v;speechSynthesis.speak(u)})}catch(e){}}
function beep(){if(!allow("sound"))return;try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),500)}catch(e){}}

/* ---------- Render ---------- */
function nav(){$("#nav").innerHTML=TABS.map(([k,n],i)=>`<button class="${k===view?"on":""}" data-v="${k}" style="border-bottom:3px solid ${COLORS[i%6]}">${n}</button>`).join("")}
$("#nav").onclick=e=>{const v=e.target.dataset.v;if(v){view=v;editId=null;render()}};
function render(){nav();applyTheme();document.documentElement.dataset.theme=S.theme;const f=V[view];$("#app").innerHTML=dateBar()+quote()+f();if(A[view])A[view]();if(lv!==view){window.scrollTo(0,0);lv=view}}
const V={},A={};

/* ---------- Home ---------- */
V.home=()=>{
  const now=new Date(),today=DAYS[now.getDay()];
  const dl=S.lessons.filter(l=>l.st!=="done").length,tt=S.tasks.length,td=S.tasks.filter(t=>t.done).length;
  const pct=S.lessons.length+tt?Math.round((S.lessons.filter(l=>l.st==="done").length+td)*100/(S.lessons.length+tt)):0;
  const up=S.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9")).slice(0,4);
  const cls=S.sched.filter(c=>c.day===today).sort((a,b)=>a.time.localeCompare(b.time));
  return `<h2>مرحبًا إبراهيم سامح 👋</h2><p style="color:var(--mu)">${today}، ${now.toLocaleDateString("ar-EG",{day:"numeric",month:"long",year:"numeric"})}</p>
  <div class="card"><b>نسبة الإنجاز: ${pct}%</b><div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="grid"><div class="card stat"><b>${dl}</b><span>دروس متبقية</span></div><div class="card stat"><b>${tt-td}</b><span>مهام متبقية</span></div><div class="card stat"><b>${S.pomo}</b><span>جلسات تركيز</span></div><div class="card stat"><b>${S.sums.length}</b><span>ملخصات محفوظة</span></div></div>
  <div class="card"><h3>المهام القادمة</h3>${up.map(t=>`<div class="item"><span>${esc(t.title)}<small>${t.due||"بدون موعد"}</small></span><span class="tag">${t.pri}</span></div>`).join("")||"<small>لا مهام. أضف مهمة من قسم المهمات.</small>"}</div>
  ${examCard()}<div class="card"><h3>حصص اليوم</h3>${cls.map(c=>`<div class="item"><span>${subjIcon(c.subj)} ${esc(c.subj)}</span><span class="tag">${fmt12(c.time)}</span></div>`).join("")||"<small>لا حصص اليوم.</small>"}</div>
  <div class="row">${TABS.slice(1,8).map(([k,n])=>`<button class="g" data-v="${k}" onclick="view='${k}';render()">${n}</button>`).join("")}</div>`};

/* ---------- Lessons ---------- */
const ST={todo:"لم يبدأ",doing:"قيد المذاكرة",done:"مكتمل"};
V.lessons=()=>{const q=val("q").toLowerCase();const e=S.lessons.find(l=>l.id===editId)||{};
  return `<h2>الدروس</h2><div class="card"><div class="row"><span id="lsi" style="font-size:28px">${subjIcon(e.subj||"")}</span><input id="ls" oninput="$('#lsi').textContent=subjIcon(this.value)" placeholder="المادة" value="${esc(e.subj||"")}" list="sl"><input id="lt" placeholder="عنوان الدرس" value="${esc(e.title||"")}"><input id="ld" type="date" value="${e.date||""}"><select id="lst">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${e.st===k?"selected":""}>${v}</option>`).join("")}</select><button onclick="saveLesson()">${editId?"حفظ التعديل":"إضافة درس"}</button></div><div class="row">${PICK.map(k=>`<button class="g" type="button" style="font-size:13px" onclick="pickSubj('${k}')">${subjIcon(k)} ${k}</button>`).join("")}</div><datalist id="sl">${subjects().map(s=>`<option value="${esc(s)}">`).join("")}</datalist><input id="q" placeholder="🔍 بحث في الدروس" style="width:100%" oninput="render();$('#q').focus()" value="${esc(val("q"))}"></div>
  <div class="card">${S.lessons.filter(l=>(l.title+l.subj).toLowerCase().includes(q)).map(l=>`<div class="item"><span class="${l.st==="done"?"done":""}">${subjIcon(l.subj)} ${esc(l.title)}<small>${esc(l.subj)} · ${l.date||"بدون موعد"}</small></span><span><span class="tag">${ST[l.st]}</span> <button class="g" onclick="editId='${l.id}';render()">تعديل</button> <button class="d" onclick="del('lessons','${l.id}')">حذف</button></span></div>`).join("")||"<small>لا توجد دروس بعد.</small>"}</div>`};
function saveLesson(){const o={subj:val("ls").trim(),title:val("lt").trim(),date:val("ld"),st:val("lst")};if(!o.title)return;
  if(editId)Object.assign(S.lessons.find(l=>l.id===editId),o);else S.lessons.push({id:uid(),...o});editId=null;save();render()}
function del(k,id){S[k]=S[k].filter(x=>x.id!==id);save();render()}

/* ---------- Tasks ---------- */
const PRI={high:"عالية",mid:"متوسطة",low:"منخفضة"};
V.tasks=()=>`<h2>المهمات</h2><div class="card"><div class="row"><input id="tt" placeholder="عنوان المهمة"><input id="td" type="date"><select id="tp">${Object.entries(PRI).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><button onclick="addTask()">إضافة</button></div></div>
<div class="card">${S.tasks.map(t=>`<div class="item"><span class="${t.done?"done":""}"><input type="checkbox" ${t.done?"checked":""} onchange="togTask('${t.id}')"> ${esc(t.title)}<small>التسليم: ${t.due||"—"}</small></span><span><span class="tag">${PRI[t.pri]||t.pri}</span> <button class="d" onclick="del('tasks','${t.id}')">حذف</button></span></div>`).join("")||"<small>لا توجد مهمات.</small>"}</div>`;
function addTask(){const t=val("tt").trim();if(!t)return;S.tasks.push({id:uid(),title:t,due:val("td"),pri:val("tp"),done:false});save();render()}
function togTask(id){const t=S.tasks.find(x=>x.id===id);t.done=!t.done;save();if(t.done)toast("🎉 أحسنت! "+QUOTES[Math.floor(Math.random()*QUOTES.length)]);render()}

/* ---------- Schedule ---------- */
V.sched=()=>{const e=S.sched.find(l=>l.id===editId)||{};
  return `<h2>جدول الحصص الأسبوعي</h2><div class="card"><div class="row"><select id="sd">${DAYS.map(d=>`<option ${e.day===d?"selected":""}>${d}</option>`).join("")}</select><input id="ss" placeholder="المادة" value="${esc(e.subj||"")}">${t12("stm",e.time||"08:00")}<button onclick="saveCls()">${editId?"حفظ":"إضافة حصة"}</button></div><small style="color:var(--mu)">يتم تنبيهك بصوت وإشعار داخل التطبيق قبل الحصة بخمس دقائق أثناء فتح التطبيق.</small></div>
  ${DAYS.map(d=>{const c=S.sched.filter(x=>x.day===d).sort((a,b)=>a.time.localeCompare(b.time));return c.length?`<div class="card"><h3>${d}</h3>${c.map(x=>`<div class="item"><span>${subjIcon(x.subj)} ${esc(x.subj)} <span class="tag">${fmt12(x.time)}</span></span><span><button class="g" onclick="editId='${x.id}';render()">تعديل</button> <button class="d" onclick="del('sched','${x.id}')">حذف</button></span></div>`).join("")}</div>`:""}).join("")}`};
function saveCls(){const o={day:val("sd"),subj:val("ss").trim(),time:get12("stm")};if(!o.subj)return;if(editId)Object.assign(S.sched.find(l=>l.id===editId),o);else S.sched.push({id:uid(),...o});editId=null;save();render()}
let fired={};setInterval(()=>{const n=new Date(),k=n.toDateString();S.sched.forEach(c=>{if(c.day!==DAYS[n.getDay()])return;const[h,m]=c.time.split(":").map(Number),diff=h*60+m-(n.getHours()*60+n.getMinutes());if(diff===5&&!fired[k+c.id]){fired[k+c.id]=1;banner("📚 حصة قريبة",`حصة ${c.subj} بعد 5 دقائق`,false);speak(`حصة ${c.subj} بعد خمس دقائق`)}})},20000);
function toast(t){const d=document.createElement("div");d.textContent=t;d.style.cssText="position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:12px;z-index:90;background:var(--p);color:#fff;padding:12px;border-radius:12px;text-align:center";document.body.append(d);setTimeout(()=>d.remove(),4500)}

/* ---------- Mind map ---------- */
V.map=()=>{const m=S.maps.find(x=>x.id===curMap);
  const head=`<h2>إنشاء الخرائط الذهنية</h2><div class="card"><div class="row"><input id="mt" placeholder="عنوان الدرس"><button onclick="newMap()">خريطة جديدة</button></div><div class="row"><input id="mi" type="file" accept="image/*"><button onclick="imgMap()">📷 خريطة من صورة</button><button onclick="aiMap()">🤖 خريطة بالذكاء الاصطناعي من العنوان</button><select id="msel" onchange="curMap=this.value;render()"><option value="">اختر خريطة محفوظة</option>${S.maps.map(x=>`<option value="${x.id}" ${x.id===curMap?"selected":""}>${esc(x.title)}</option>`).join("")}</select></div></div>`;
  if(!m)return head;
  return head+`<div class="card"><div class="row"><select id="mp">${m.nodes.map(n=>`<option value="${n.id}">${esc(n.text)}</option>`).join("")}</select><input id="mx" placeholder="فكرة جديدة"><button onclick="addNode()">إضافة فرع</button></div><canvas id="cv" width="1200" height="900"></canvas>
  <div class="row" style="margin-top:10px"><button class="g" onclick="S.mapMode=S.mapMode==='tree'?'radial':'tree';save();render()">${S.mapMode==="tree"?"عرض دائري":"عرض شجري"}</button><button onclick="expPng()">تصدير PNG</button><button class="d" onclick="delMap()">حذف الخريطة</button></div>
  ${m.nodes.slice(1).map(n=>`<div class="item"><span style="color:${n.color}">●</span><input value="${esc(n.text)}" onchange="editNode('${n.id}',this.value)" style="flex:1"><button class="d" onclick="delNode('${n.id}')">حذف</button></div>`).join("")}</div>`};
A.map=()=>draw();
function newMap(){const t=val("mt").trim();if(!t)return;const m={id:uid(),title:t,nodes:[{id:"r",text:t,parent:null,color:"#8b5cf6"}]};S.maps.push(m);curMap=m.id;save();render()}

async function claudeCall(prompt,search){const k=S.ckey;if(!k)throw {message:"أضف مفتاح Claude أولًا من قسم «مفاهيم الامتحان»."};

 let j;try{j=await go(body)}catch(e){if(search&&/tool|search/i.test(e.message||"")){delete body.tools;j=await go(body)}else throw e}
